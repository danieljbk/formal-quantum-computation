name: CradleCall
options:
  bundleIdPrefix: app.cradlecall
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  CradleCall:
    type: application
    platform: iOS
    sources:
      - path: App
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: CradleCall
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        NSAlarmKitUsageDescription: CradleCall schedules alarms so a crying baby can wake you, even in Silent mode.
        NSMicrophoneUsageDescription: Record your own baby's cry to use as an alarm sound.
        NSCameraUsageDescription: Scan a barcode to complete the barcode wake-up mission.
        NSMotionUsageDescription: Count shakes and steps for the shake and walking wake-up missions.
        NSLocationWhenInUseUsageDescription: Show today's local weather in your morning briefing.
        NSCalendarsFullAccessUsageDescription: Show today's events in your morning briefing.
    entitlements:
      path: Support/CradleCall.entitlements
      properties:
        com.apple.developer.usernotifications.time-sensitive: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cradlecall.CradleCall
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
  CradleCallTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CradleCallTests
    dependencies:
      - target: CradleCall
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.cradlecall.CradleCallTests
schemes:
  CradleCall:
    build:
      targets:
        CradleCall: all
        CradleCallTests: [test]
    test:
      targets:
        - CradleCallTests
      gatherCoverageData: false
    run:
      config: Debug
