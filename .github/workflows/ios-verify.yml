name: iOS Verify (klean)

on:
  push:
    branches:
      - 'claude/klean-*'
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Branch or SHA to build, test, screenshot, and package'
        required: false
        type: string

jobs:
  ios-build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_ref || github.ref }}

      - name: Locate iOS / Swift / Web-iOS app manifest (ignoring exemplar QuantumComputation)
        id: find_app
        run: |
          set -euo pipefail
          PROJ_YML=$(find . -maxdepth 3 \( -path './QuantumComputation*' -o -path './.git*' -o -path './.github*' -o -path '*/node_modules*' \) -prune -o -name 'project.yml' -print | head -n 1 || true)
          XCPROJ=$(find . -maxdepth 3 \( -path './QuantumComputation*' -o -path './.git*' -o -path './.github*' -o -path '*/node_modules*' \) -prune -o -name '*.xcodeproj' -print | head -n 1 || true)
          PKG_SWIFT=$(find . -maxdepth 3 \( -path './QuantumComputation*' -o -path './.git*' -o -path './.github*' -o -path '*/node_modules*' \) -prune -o -name 'Package.swift' -print | head -n 1 || true)
          PKG_JSON=$(find . -maxdepth 3 \( -path './QuantumComputation*' -o -path './.git*' -o -path './.github*' -o -path '*/node_modules*' \) -prune -o -name 'package.json' -print | head -n 1 || true)
          echo "proj_yml=$PROJ_YML" >> "$GITHUB_OUTPUT"
          echo "xcproj=$XCPROJ" >> "$GITHUB_OUTPUT"
          echo "pkg_swift=$PKG_SWIFT" >> "$GITHUB_OUTPUT"
          echo "pkg_json=$PKG_JSON" >> "$GITHUB_OUTPUT"
          echo "FOUND: proj_yml=$PROJ_YML xcproj=$XCPROJ pkg_swift=$PKG_SWIFT pkg_json=$PKG_JSON"

      - name: Build and Test App
        run: |
          set -euo pipefail
          PROJ_YML="${{ steps.find_app.outputs.proj_yml }}"
          XCPROJ="${{ steps.find_app.outputs.xcproj }}"
          PKG_SWIFT="${{ steps.find_app.outputs.pkg_swift }}"
          PKG_JSON="${{ steps.find_app.outputs.pkg_json }}"
          DERIVED="$GITHUB_WORKSPACE/_ios_derived"

          if [ -z "$PROJ_YML" ] && [ -z "$XCPROJ" ] && [ -z "$PKG_SWIFT" ] && [ -z "$PKG_JSON" ]; then
            echo "IOS_MANIFEST_OK=false"
            echo "IOS_BUILD_OK=false"
            echo "IOS_TEST_OK=false"
            echo "ERROR: No project.yml, *.xcodeproj, Package.swift, or package.json found outside exemplar repo."
            exit 1
          fi

          echo "IOS_MANIFEST_OK=true"
          xcodebuild -version || true
          swift --version || true
          node --version || true

          if [ -n "$PROJ_YML" ]; then
            APP_DIR=$(dirname "$PROJ_YML")
            cd "$APP_DIR"
            if ! command -v xcodegen >/dev/null 2>&1; then
              brew install xcodegen
            fi
            xcodegen generate
            XCPROJ_LOCAL=$(find . -maxdepth 2 -name '*.xcodeproj' | head -n 1)
            echo "Generated Xcode project: $XCPROJ_LOCAL"
            SCHEME=$(python3 -c '
          import json, subprocess, sys
          raw = subprocess.check_output(["xcodebuild", "-list", "-json", "-project", sys.argv[1]], text=True)
          d = json.loads(raw)
          schemes = d.get("project", {}).get("schemes", [])
          print(schemes[0] if schemes else "")
          ' "$XCPROJ_LOCAL")
            echo "Using scheme: $SCHEME"
            xcodebuild -project "$XCPROJ_LOCAL" -scheme "$SCHEME" -derivedDataPath "$DERIVED" -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
            echo "IOS_BUILD_OK=true"
            HAS_TEST=$(python3 -c '
          import json, subprocess, sys
          raw = subprocess.check_output(["xcodebuild", "-list", "-json", "-project", sys.argv[1]], text=True)
          d = json.loads(raw)
          targets = d.get("project", {}).get("targets", [])
          print("yes" if any("Test" in t for t in targets) else "no")
          ' "$XCPROJ_LOCAL")
            if [ "$HAS_TEST" = "yes" ]; then
              SIM_ID=$(xcrun simctl list devices available | grep -E "iPhone " | head -n 1 | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/' || true)
              if [ -n "$SIM_ID" ]; then
                xcodebuild -project "$XCPROJ_LOCAL" -scheme "$SCHEME" -derivedDataPath "$DERIVED" -destination "platform=iOS Simulator,id=$SIM_ID" ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO test
                echo "IOS_TEST_OK=true"
              else
                xcodebuild -project "$XCPROJ_LOCAL" -scheme "$SCHEME" -derivedDataPath "$DERIVED" -destination 'platform=iOS Simulator,name=iPhone 16' ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO test
                echo "IOS_TEST_OK=true"
              fi
            else
              echo "IOS_TEST_OK=false"
              echo "ERROR: No test target found in project."
              exit 1
            fi
          elif [ -n "$XCPROJ" ]; then
            APP_DIR=$(dirname "$XCPROJ")
            PROJ_NAME=$(basename "$XCPROJ")
            cd "$APP_DIR"
            SCHEME=$(python3 -c '
          import json, subprocess, sys
          raw = subprocess.check_output(["xcodebuild", "-list", "-json", "-project", sys.argv[1]], text=True)
          d = json.loads(raw)
          schemes = d.get("project", {}).get("schemes", [])
          print(schemes[0] if schemes else "")
          ' "$PROJ_NAME")
            xcodebuild -project "$PROJ_NAME" -scheme "$SCHEME" -derivedDataPath "$DERIVED" -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
            echo "IOS_BUILD_OK=true"
            HAS_TEST=$(python3 -c '
          import json, subprocess, sys
          raw = subprocess.check_output(["xcodebuild", "-list", "-json", "-project", sys.argv[1]], text=True)
          d = json.loads(raw)
          targets = d.get("project", {}).get("targets", [])
          print("yes" if any("Test" in t for t in targets) else "no")
          ' "$PROJ_NAME")
            if [ "$HAS_TEST" = "yes" ]; then
              SIM_ID=$(xcrun simctl list devices available | grep -E "iPhone " | head -n 1 | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/' || true)
              xcodebuild -project "$PROJ_NAME" -scheme "$SCHEME" -derivedDataPath "$DERIVED" -destination "platform=iOS Simulator,id=$SIM_ID" ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO test
              echo "IOS_TEST_OK=true"
            else
              echo "IOS_TEST_OK=false"
              exit 1
            fi
          elif [ -n "$PKG_SWIFT" ]; then
            APP_DIR=$(dirname "$PKG_SWIFT")
            cd "$APP_DIR"
            swift build
            echo "IOS_BUILD_OK=true"
            swift test
            echo "IOS_TEST_OK=true"
          elif [ -n "$PKG_JSON" ]; then
            APP_DIR=$(dirname "$PKG_JSON")
            cd "$APP_DIR"
            if [ -f "package-lock.json" ]; then
              npm ci
            else
              npm install
            fi
            if [ -f "tsconfig.json" ]; then
              npx tsc --noEmit
            fi
            npm run build
            if [ -f "dist/index.html" ] || [ -f "build/index.html" ]; then
              echo "IOS_BUILD_OK=true"
              echo "WEB_PLAYABLE_OK=true"
            else
              echo "IOS_BUILD_OK=false"
              echo "WEB_PLAYABLE_OK=false"
              exit 1
            fi
            CI=true npm test --if-present
            echo "IOS_TEST_OK=true"
          fi

      - name: Package Simulator App, Web Bundle, Screenshot, and Audio Preview
        if: always()
        run: |
          set +e
          mkdir -p "$GITHUB_WORKSPACE/_preview_app" "$GITHUB_WORKSPACE/_preview_media/audio" "$GITHUB_WORKSPACE/_preview_web"
          APP_PATH=$(find "$GITHUB_WORKSPACE/_ios_derived/Build/Products/Debug-iphonesimulator" -maxdepth 2 -name '*.app' ! -name '*Tests*.app' ! -name '*UITests*.app' 2>/dev/null | head -n 1 || true)
          APP_NAME=""
          BUNDLE_ID=""
          HAS_SCREENSHOT=false
          HAS_WEB_APP=false

          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            PLIST="$APP_PATH/Info.plist"
            BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST" 2>/dev/null || true)
            APP_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Print :CFBundleName" "$PLIST" 2>/dev/null || basename "$APP_PATH" .app)
            ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$GITHUB_WORKSPACE/_preview_app/app-simulator.zip"

            SIM_ID=$(xcrun simctl list devices available | grep -E "iPhone " | head -n 1 | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/' || true)
            if [ -n "$SIM_ID" ] && [ -n "$BUNDLE_ID" ]; then
              xcrun simctl boot "$SIM_ID" 2>/dev/null || true
              xcrun simctl bootstatus "$SIM_ID" -b 2>/dev/null || true
              xcrun simctl install "$SIM_ID" "$APP_PATH" && \
              xcrun simctl launch "$SIM_ID" "$BUNDLE_ID" && \
              sleep 4 && \
              xcrun simctl io "$SIM_ID" screenshot "$GITHUB_WORKSPACE/_preview_media/screen_launch.png" && \
              HAS_SCREENSHOT=true
            fi
          fi

          PKG_JSON="${{ steps.find_app.outputs.pkg_json }}"
          if [ -n "$PKG_JSON" ]; then
            WEB_APP_DIR=$(dirname "$PKG_JSON")
            for CAND in "$WEB_APP_DIR/dist" "$WEB_APP_DIR/build"; do
              if [ -f "$CAND/index.html" ]; then
                cp -R "$CAND"/. "$GITHUB_WORKSPACE/_preview_web/"
                HAS_WEB_APP=true
                if [ -z "$APP_NAME" ]; then
                  APP_NAME=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d.get("name",""))' "$PKG_JSON" 2>/dev/null || basename "$WEB_APP_DIR")
                fi
                break
              fi
            done
          fi

          while IFS= read -r AF; do
            [ -z "$AF" ] && continue
            BASE=$(basename "$AF")
            EXT="${BASE##*.}"
            EXT_LOWER=$(printf '%s' "$EXT" | tr '[:upper:]' '[:lower:]')
            STEM="${BASE%.*}"
            if [ "$EXT_LOWER" = "caf" ]; then
              afconvert -f m4af -d aac "$AF" "$GITHUB_WORKSPACE/_preview_media/audio/${STEM}.m4a" 2>/dev/null || cp "$AF" "$GITHUB_WORKSPACE/_preview_media/audio/$BASE"
            else
              cp "$AF" "$GITHUB_WORKSPACE/_preview_media/audio/$BASE"
            fi
          done < <(find "$GITHUB_WORKSPACE" -maxdepth 6 \( -path "$GITHUB_WORKSPACE/QuantumComputation*" -o -path "$GITHUB_WORKSPACE/.git*" -o -path "$GITHUB_WORKSPACE/.github*" -o -path '*/node_modules*' -o -path "$GITHUB_WORKSPACE/_preview_*" -o -path "$GITHUB_WORKSPACE/_ios_derived*" \) -prune -o -type f \( -iname '*.caf' -o -iname '*.wav' -o -iname '*.m4a' -o -iname '*.mp3' \) -print)

          TARGET_BRANCH="${{ github.event.inputs.target_ref || github.ref_name }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          python3 - "$GITHUB_WORKSPACE" "$TARGET_BRANCH" "${{ github.sha }}" "$APP_NAME" "$BUNDLE_ID" "${{ github.run_id }}" "$RUN_URL" "$HAS_SCREENSHOT" "$HAS_WEB_APP" <<'PY'
          import json, os, sys
          ws, br, sha, name, bid, rid, rurl, hs, hw = sys.argv[1:10]
          aud_dir = os.path.join(ws, "_preview_media", "audio")
          audio_files = sorted(f for f in os.listdir(aud_dir) if not f.startswith(".")) if os.path.isdir(aud_dir) else []
          meta = {
              "branch": br,
              "sha": sha,
              "app_name": name,
              "bundle_id": bid,
              "run_id": rid,
              "run_url": rurl,
              "has_app": os.path.exists(os.path.join(ws, "_preview_app", "app-simulator.zip")),
              "has_screenshot": (hs == "true"),
              "has_web_app": (hw == "true"),
              "audio_files": audio_files,
          }
          with open(os.path.join(ws, "_preview_app", "metadata.json"), "w") as f:
              json.dump(meta, f, indent=2)
          with open(os.path.join(ws, "_preview_media", "manifest.json"), "w") as f:
              json.dump(meta, f, indent=2)
          print(json.dumps(meta, indent=2))
          PY

      - name: Upload Simulator App Bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: _preview_app/
          retention-days: 14

      - name: Upload Preview Media (Screenshot + Playable Audio)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-preview-media
          path: _preview_media/
          retention-days: 14

      - name: Upload Browser-Playable Web App Bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-playable-app
          path: _preview_web/
          retention-days: 14
